name: 构建 macOS（Apple 芯片）

# Apple 芯片安装包只能在 macOS 上生成：electron-builder 不支持在 Windows/Linux 上打 mac 包，
# 而且 arm64 应用必须有代码签名。这里用 GitHub 自带的 Apple 芯片 runner 云端构建，
# 产物为 ad-hoc 签名的 .dmg 和 .zip（没有 Apple 开发者证书，因此不公证）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maruko-exe/**"
      - "ui-redesign/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    runs-on: macos-14
    defaults:
      run:
        working-directory: maruko-exe
    env:
      # 不查找钥匙串里的开发者证书，交给 packaging/adhoc-sign.js 做 ad-hoc 签名
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: maruko-exe/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 同步界面并打包 macOS arm64
        run: npm run dist:mac

      - name: 校验签名与产物
        run: |
          APP=$(ls -d release-1.2.7-mac/mac*/小丸工具箱.app)
          echo "app: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20
          codesign --verify --deep --strict "$APP"
          ls -lh release-1.2.7-mac
          shasum -a 256 release-1.2.7-mac/*.dmg release-1.2.7-mac/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: maruko-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            maruko-exe/release-1.2.7-mac/*.dmg
            maruko-exe/release-1.2.7-mac/*.zip
